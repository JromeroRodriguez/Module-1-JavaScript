<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Rick & Morty Archive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header id="site-header">
        <div class="header-inner">
            <img src="img/logo.png" alt="Rick and Morty Logo" id="site-logo">
            <div class="header-text">
                <h1 id="site-title">Rick & Morty API</h1>
                <span class="site-subtitle">Character Archive</span>
            </div>
        </div>
    </header>

    <main>
        <div class="filter-bar">
            <label for="filterGender">Filter by genre:</label>
            <select id="filterGender" onchange="filterByGender()">
                <option value="">ALL</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="unknown">Unknown</option>
            </select>
        </div>
        <div id="loading" style="display:none">
            <div class="loading-spinner"></div>
            <span class="loading-text">Loading...</span>
        </div>
        <ul id="character"></ul>

        <div class="pagination">
            <button id="btnPrev" data-prev="" onclick="loadMore('prev')">&#8592; Previous</button>
            <span id="pageIndicator"></span>
            <button id="btnNext" data-next="" onclick="loadMore('next')">Next &#8594;</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.16.0/dist/axios.min.js"></script>
    <script src="API.js"></script> 
</body>
</html>
